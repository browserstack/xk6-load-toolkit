name: Tag main

# Every commit that lands on main gets the next release tag (v0.1.N), so a k6
# binary built from main names its source by tag. Run it by hand to tag the
# current tip of main.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two pushes never compute the same next number.
concurrency:
  group: tag-main
  cancel-in-progress: false

jobs:
  tag:
    # A manual run from another branch must not tag that branch's commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag this commit
        env:
          COMMIT: ${{ github.sha }}
        run: bash scripts/tag-release.sh "$COMMIT"
