name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  # Same toolchain as release.yml: test on the Go that ships.
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.8" # keep equal to GO_VERSION in release.yml
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: Denylist
        run: bash scripts/denylist.sh
      - name: Release gate tests
        run: bash scripts/release-gate_test.sh
