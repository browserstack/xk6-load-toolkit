name: Release

# A v* tag builds k6 with every extension in extensions.json for linux/amd64 and
# linux/arm64, proves each binary with scripts/release-gate.sh, and only then
# publishes the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Exactly the Go in the pinned golang image that from-source builds of this
  # extension use (golang:1.26-bookworm@sha256:9fdc884a..., GOLANG_VERSION), so a
  # release binary and a source-built one compile with the same toolchain. Bump
  # both together. GOTOOLCHAIN=local, as in that image: never let go.mod pull in
  # a different toolchain.
  GO_VERSION: "1.26.8"
  GOTOOLCHAIN: local
  XK6_VERSION: "v1.4.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -count=1 ./...
      - run: bash scripts/denylist.sh
      - run: bash scripts/release-gate_test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install xk6
        run: go install "go.k6.io/xk6/cmd/xk6@${XK6_VERSION}"
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: ./build.sh --output "dist/k6-linux-${GOARCH}"
      - name: Release gate
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/release-gate.sh --binary "dist/k6-linux-${ARCH}" --arch "${ARCH}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k6-linux-${{ matrix.arch }}
          path: dist/k6-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Assemble assets
        run: |
          cp extensions.json LICENSE NOTICE dist/
          chmod 0755 dist/k6-linux-amd64 dist/k6-linux-arm64
          (cd dist && sha256sum k6-linux-amd64 k6-linux-arm64 extensions.json > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Release notes
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          k6_version="$(jq -r .k6Version extensions.json)"
          src="${SERVER_URL}/${REPOSITORY}/tree/${GITHUB_REF_NAME}"
          {
            echo "k6 ${k6_version} built with xk6 ${XK6_VERSION} and Go ${GO_VERSION} (CGO disabled), for linux/amd64 and linux/arm64."
            echo
            echo "Corresponding source: ${src} (built by \`build.sh\` from \`extensions.json\` at this tag)."
            echo "Each binary passed \`scripts/release-gate.sh\` (Go build info against \`extensions.json\`) before upload."
            echo
            echo "| Module | Version |"
            echo "|---|---|"
            echo "| go.k6.io/k6/v2 | ${k6_version} |"
            jq -r --arg tag "$GITHUB_REF_NAME" '.extensions[] | "| \(.module) | \(.version // $tag) |"' extensions.json
            echo
            echo "Licence: AGPL-3.0 (\`LICENSE\`); third-party notices: \`NOTICE\`. Verify a download with \`sha256sum -c SHA256SUMS\`."
          } > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/k6-linux-amd64 dist/k6-linux-arm64 dist/SHA256SUMS dist/extensions.json dist/LICENSE dist/NOTICE
